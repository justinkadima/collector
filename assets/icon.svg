<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- not1 — a page you own: cream paper on ink, one block in the accent blue.
       Everything below is plain shapes so 1024px of it downscales cleanly to
       16px: the silhouette survives, and the blue row is the last detail to go. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3834"/>
      <stop offset="0.55" stop-color="#26241f"/>
      <stop offset="1" stop-color="#161513"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ec"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efece2"/>
      <stop offset="1" stop-color="#d9d3c4"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.36"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
    <!-- a hair of light along the top edge, so the tile reads as a surface -->
    <rect x="100" y="100" width="824" height="4" fill="#ffffff" opacity="0.10"/>

    <!-- the page, folded at the top-right -->
    <g filter="url(#lift)">
      <path d="M 338 204 H 612 L 736 328 V 730 A 46 46 0 0 1 690 776 H 338 A 46 46 0 0 1 292 730 V 250 A 46 46 0 0 1 338 204 Z"
            fill="url(#paper)"/>
    </g>
    <path d="M 612 204 L 736 328 H 612 Z" fill="url(#fold)"/>

    <!-- a heading, three bullets, and the block you are on -->
    <rect x="352" y="340" width="244" height="36" rx="18" fill="#37352f"/>
    <g fill="#c2bdaf">
      <circle cx="360" cy="440" r="8.5"/><rect x="386" y="431.5" width="244" height="17" rx="8.5"/>
      <circle cx="360" cy="494" r="8.5"/><rect x="386" y="485.5" width="214" height="17" rx="8.5"/>
      <circle cx="360" cy="548" r="8.5"/><rect x="386" y="539.5" width="244" height="17" rx="8.5"/>
    </g>
    <g fill="#2383e2">
      <circle cx="360" cy="616" r="8.5"/><rect x="386" y="607.5" width="188" height="17" rx="8.5"/>
    </g>
  </g>

  <!-- tile edge: keeps the silhouette crisp on a light dock and a dark one -->
  <rect x="101" y="101" width="822" height="822" rx="185" ry="185"
        fill="none" stroke="#000" stroke-opacity="0.30" stroke-width="2"/>
</svg>
