name: Release

# One tag, three downloads. A tag on its own gives nobody anything to run;
# this attaches the built programs to the release GitHub makes for it.
#
#   git tag -a v0.8 -F msg && git push origin v0.8

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    name: The tag and the program agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release whose binary reports a different number than its tag is worse
      # than no release: it makes `collector -version` a lie. The version is a Go
      # variable, so this is the only place the two can be compared.
      - name: Compare the tag with main.go
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^var version = "\(.*\)".*/\1/p' main.go)
          echo "tag $GITHUB_REF_NAME, program $have"
          if [ "$want" != "$have" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but main.go says \"$have\""
            exit 1
          fi

  macos:
    name: macOS bundle
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Collector.app
        run: ./scripts/bundle.sh

      - name: Zip it
        run: |
          cd dist
          ditto -c -k --keepParent Collector.app "Collector-${GITHUB_REF_NAME}-macOS-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux binary
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Built without cgo on purpose: a GTK build needs WebKitGTK 4.0 headers,
      # which the current distros have dropped, and a binary linked against
      # 4.0 would not start on them either. The CGO-free build runs everywhere
      # and opens the same UI in the default browser.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o collector .

      - name: Package
        run: |
          tar -czf "Collector-${GITHUB_REF_NAME}-linux-amd64.tar.gz" collector LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"
          if-no-files-found: error

  windows:
    name: Windows binary
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o collector.exe .

      - name: Package
        run: |
          Compress-Archive -Path collector.exe, LICENSE, README.md -DestinationPath "Collector-$env:GITHUB_REF_NAME-windows-amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Collector ${GITHUB_REF_NAME#v}" \
              --latest \
              --generate-notes
          fi
          # A draft is not a download. Re-tagging flips an existing release back to
          # draft, so the state is asserted every run rather than assumed.
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
