name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: JavaScript parses
        run: |
          for f in web/*.js scripts/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

  build:
    name: build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # The real window: WebKit on macOS, GTK + WebKitGTK 4.0 on Ubuntu 22.04.
          - os: macos-latest
            cgo: "1"
            webkit: "0"
          - os: ubuntu-22.04
            cgo: "1"
            webkit: "1"
          # Newer distros ship WebKitGTK 4.1 only, and WebView2 needs a toolchain
          # we do not install, so both of these build the CGO-free stub and run in
          # the browser. Same code, different door.
          - os: ubuntu-latest
            cgo: "0"
            webkit: "0"
          - os: windows-latest
            cgo: "0"
            webkit: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GTK and WebKitGTK
        if: matrix.webkit == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ./...

      - name: It starts and knows its version
        run: go run . -version
        shell: bash
