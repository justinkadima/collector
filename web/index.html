<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>not1</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd6'/%3E%3Ctext x='16' y='23' font-family='-apple-system,sans-serif' font-size='19' font-weight='600' fill='white' text-anchor='middle'%3En%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="ws-head">
          <button class="ws-btn" id="ws-btn" title="Workspace menu">
            <span class="ws-avatar" id="ws-avatar">n</span>
            <span class="ws-name" id="ws-name">not1</span>
            <svg class="i chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <button class="icon-btn" id="collapse-btn" title="Hide sidebar (⌘\)" aria-label="Hide sidebar"></button>
        </div>

        <div class="side-tools">
          <button class="search-btn" id="search-btn">
            <svg class="i" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7.5" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <span>Search</span>
            <span class="kbd">⌘P</span>
          </button>
        </div>

        <div class="side-actions">
          <button class="side-action" id="new-page-btn">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            <span>New page</span>
          </button>
          <button class="side-action" id="new-folder-btn">
            <svg class="i" viewBox="0 0 24 24">
              <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
              <path d="M12 10v6M9 13h6" />
            </svg>
            <span>New folder</span>
          </button>
        </div>

        <div class="side-scroll">
          <div id="tree"></div>
          <div id="side-recent"></div>
        </div>

        <div class="side-foot">
          <button class="icon-btn" id="theme-btn" title="Toggle theme"></button>
          <span class="spacer"></span>
          <span id="page-count"></span>
          <button class="icon-btn" id="reveal-btn" title="Reveal workspace in Finder"></button>
        </div>
      </aside>

      <div id="resizer"></div>

      <main id="main">
        <header id="topbar">
          <button class="icon-btn hidden" id="show-sidebar" title="Show sidebar (⌘\)"></button>
          <div class="crumbs" id="crumbs"></div>
          <div class="topbar-right">
            <span class="save-state" id="save-state"></span>
            <div class="seg" id="mode-seg">
              <button class="seg-btn active" data-mode="write">Write</button>
              <button class="seg-btn" data-mode="read">Read</button>
            </div>
            <button class="icon-btn" id="page-menu" title="Page options" aria-label="Page options"></button>
          </div>
        </header>

        <div class="scroller" id="scroller">
          <div id="welcome" class="welcome hidden"></div>

          <div id="empty" class="empty-state hidden"></div>

          <article id="page" class="page hidden">
            <button class="page-icon" id="page-icon" title="Change icon"></button>
            <h1
              class="page-title"
              id="page-title"
              contenteditable="true"
              spellcheck="false"
              data-placeholder="Untitled"
            ></h1>
            <div class="page-meta" id="page-meta"></div>
            <div id="banner" class="banner hidden"></div>
            <div id="db-desc" class="db-desc hidden"></div>
            <div id="db-view" class="db hidden"></div>
            <div class="write-wrap" id="write-wrap">
              <textarea
                id="editor"
                spellcheck="true"
                placeholder="Write something, or type “/” for blocks…"
              ></textarea>
            </div>
            <div id="preview" class="md hidden"></div>
            <section id="backlinks" class="backlinks hidden"></section>
          </article>
        </div>
      </main>
    </div>

    <div id="overlay-root"></div>
    <div id="toasts"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
